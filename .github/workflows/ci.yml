name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-release:
    name: Windows Release build + tests
    runs-on: windows-latest
    env:
      # Pinned so CI resolves the exact same package versions as
      # vcpkg-configuration.json's baseline, regardless of what vcpkg
      # revision a given runner image happens to ship with.
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg-ci

    steps:
      - name: Check out RVWheel
        uses: actions/checkout@v4

      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg "${{ env.VCPKG_ROOT }}"

      - name: Cache vcpkg-built packages
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT }}\installed
          key: vcpkg-installed-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Bootstrap vcpkg
        run: '& "${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat" -disableMetrics'
        shell: pwsh

      - name: Configure (Release, no Logitech SDK)
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake" `
            -DRVWHEEL_ENABLE_LOGITECH_SDK=OFF `
            -DRVWHEEL_BUILD_TESTS=ON `
            -DRVWHEEL_BUILD_TOOLS=ON
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release
        shell: pwsh

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
        shell: pwsh
